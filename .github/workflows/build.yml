name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest -k expression to narrow the test run'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-2022]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        # Pin release-era CPython patch levels: 3.9.24+/3.10.19+/3.11.14+ hardened html.parser so <iframe> children are no longer parsed, breaking the project's iframe tests.
        include:
          - tox-env: py37
            python-version: 3.7
          - tox-env: py38
            python-version: 3.8
          - tox-env: py39
            python-version: '3.9.13'
          - tox-env: py310
            python-version: '3.10.11'
          - tox-env: py311
            python-version: '3.11.3'
          - tox-env: nolxml
            python-version: '3.11.3'
          - tox-env: nohtml5lib
            python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}
      PIP_INDEX_URL: https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      env:
        PYTEST_ADDOPTS: ${{ inputs.test-filter && format('-k "{0}"', inputs.test-filter) || '' }}
      run: |
        python -m tox

  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      PIP_INDEX_URL: https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Package
        run: |
          pip install --upgrade build
          echo "hatchling==1.14.0" > "${RUNNER_TEMP}/build-constraints.txt"
          PIP_CONSTRAINT="${RUNNER_TEMP}/build-constraints.txt" python -m build -s -w
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
